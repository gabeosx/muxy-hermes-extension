name: muxy-hermes-simulations

x-hermes-image: &hermes-image nousresearch/hermes-agent:v2026.8.16@sha256:f8f548d87d16634d1ad9e3777280f3f577ba2358703f04e18e74007ffd3621bf

services:
  model-stub:
    image: *hermes-image
    entrypoint: ["python3", "/fixture/model-stub.py"]
    environment:
      MODEL_STUB_DELAY_MS: ${MODEL_STUB_DELAY_MS:-250}
    volumes:
      - ./model-stub.py:/fixture/model-stub.py:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 10

  gateway:
    image: *hermes-image
    depends_on:
      model-stub:
        condition: service_healthy
    command: ["gateway", "run", "--force"]
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_SIM_TOKEN:-simulation-fixture-only}
    volumes:
      - ${HERMES_SIM_HOME:-/private/tmp/muxy-hermes-simulation-home}:/opt/data
    ports:
      - "127.0.0.1:${HERMES_SIM_PORT:-18642}:8642"
